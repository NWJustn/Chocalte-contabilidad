<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis Chocolates · Contabilidad</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#6b3a24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chocolates">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">

<style>
:root{--bg:#faf5f0;--card:#fff;--tx:#3b2418;--mu:#8a7266;--ac:#6b3a24;--ok:#2e7d4f;--bad:#b3392f;--bd:#e8dcd2;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1511;--card:#2a1d17;--tx:#f3e8e0;--mu:#a8928686;--mu:#a89286;--ac:#d9a07c;--ok:#5fc88a;--bad:#ef7d72;--bd:#3d2c24;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1e1511;--card:#2a1d17;--tx:#f3e8e0;--mu:#a89286;--ac:#d9a07c;--ok:#5fc88a;--bad:#ef7d72;--bd:#3d2c24;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:17px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
header{padding:18px 16px 6px}
h1{font-size:22px;margin:0}
h2{font-size:17px;margin:20px 0 8px}
main{padding:0 16px;max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1;min-width:0}
label{display:block;font-size:14px;color:var(--mu);margin:10px 0 4px}
input,select{width:100%;font:inherit;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:13px 16px;background:var(--ac);color:var(--bg);font-weight:600;width:100%;margin-top:12px}
button.sm{width:auto;margin:0;padding:8px 12px;background:var(--bd);color:var(--tx)}
button.x{width:auto;margin:0;padding:6px 10px;background:transparent;color:var(--bad)}
.seg{display:flex;gap:6px;margin-bottom:12px}
.seg button{margin:0;background:var(--bd);color:var(--tx);padding:10px}
.seg button.on{background:var(--ac);color:var(--bg)}
.big{font-size:30px;font-weight:700}
.ok{color:var(--ok)}.bad{color:var(--bad)}.mu{color:var(--mu);font-size:14px}
.item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}
.item:last-child{border:0}
.item b{display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{margin:0;border-radius:0;background:transparent;color:var(--mu);font-size:13px;padding:10px 2px;display:flex;flex-direction:column;gap:2px;align-items:center}
nav button span{font-size:22px}
nav button.on{color:var(--ac)}
.empty{text-align:center;color:var(--mu);padding:16px 0}
.low{background:var(--bad);color:#fff;border-radius:6px;padding:1px 6px;font-size:12px;margin-left:6px}
</style>
</head>
<body>
<header><h1>🍫 Mis Chocolates</h1><div class="mu" id="hoy"></div></header>
<main id="app"></main>
<nav id="nav"></nav>
<script>
var KEY="chocolates_v1",S={v:[],g:[],i:[]},tab="inicio",per="mes";
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);S.v=p.v||[];S.g=p.g||[];S.i=p.i||[]}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function money(n){return "$"+Math.round(n).toLocaleString("es-CL")}
function hoy(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function uid(){return Date.now()+Math.floor(Math.random()*1000)}
function fdate(s){var a=s.split("-");return a[2]+"/"+a[1]}
function inPer(f){var h=hoy();return per=="todo"||(per=="hoy"&&f==h)||(per=="mes"&&f.slice(0,7)==h.slice(0,7))}
$("hoy").textContent=new Date().toLocaleDateString("es-CL",{weekday:"long",day:"numeric",month:"long"});
var TABS=[["inicio","🏠","Inicio"],["ventas","💰","Ventas"],["gastos","🧾","Gastos"],["inv","📦","Inventario"]];
function nav(){$("nav").innerHTML=TABS.map(function(t){return '<button class="'+(tab==t[0]?"on":"")+'" onclick="go(\''+t[0]+'\')"><span>'+t[1]+'</span>'+t[2]+'</button>'}).join("")}
function go(t){tab=t;render()}
function setPer(p){per=p;render()}
function segHtml(){return '<div class="seg">'+[["hoy","Hoy"],["mes","Este mes"],["todo","Todo"]].map(function(x){return '<button class="'+(per==x[0]?"on":"")+'" onclick="setPer(\''+x[0]+'\')">'+x[1]+'</button>'}).join("")+"</div>"}
function sum(a,k){return a.reduce(function(s,x){return s+x[k]},0)}

function vInicio(){
 var v=S.v.filter(function(x){return inPer(x.f)}),g=S.g.filter(function(x){return inPer(x.f)});
 var tv=sum(v,"t"),tg=sum(g,"m"),gan=tv-tg,top={};
 v.forEach(function(x){top[x.p]=(top[x.p]||0)+x.c});
 var tl=Object.keys(top).sort(function(a,b){return top[b]-top[a]}).slice(0,5);
 var bajos=S.i.filter(function(x){return x.c<=2});
 return segHtml()+'<div class="card"><div class="mu">Ganancia</div><div class="big '+(gan>=0?"ok":"bad")+'">'+money(gan)+'</div></div>'+
 '<div class="grid"><div class="card"><div class="mu">Ventas</div><b class="ok">'+money(tv)+'</b></div><div class="card"><div class="mu">Gastos</div><b class="bad">'+money(tg)+'</b></div></div>'+
 '<h2>Lo más vendido</h2><div class="card">'+(tl.length?tl.map(function(n){return '<div class="item"><span>'+esc(n)+'</span><b>'+top[n]+' un.</b></div>'}).join(""):'<div class="empty">Aún no hay ventas</div>')+'</div>'+
 (bajos.length?'<h2>Quedan pocos</h2><div class="card">'+bajos.map(function(x){return '<div class="item"><span>'+esc(x.n)+'</span><b class="bad">'+x.c+'</b></div>'}).join("")+'</div>':"")
}
function vVentas(){
 var prods=S.i.filter(function(x){return x.t=="p"});
 var opts='<option value="">Otro producto…</option>'+prods.map(function(x){return '<option value="'+x.id+'">'+esc(x.n)+' (quedan '+x.c+')</option>'}).join("");
 var list=S.v.filter(function(x){return inPer(x.f)}).slice().reverse();
 return '<div class="card"><b>Anotar venta</b><label>Producto</label><select id="vp" onchange="vSel()">'+opts+'</select>'+
 '<div id="vn"><label>Nombre</label><input id="vnom" placeholder="Ej: Bombones"></div>'+
 '<div class="row"><div><label>Cantidad</label><input id="vc" type="number" inputmode="numeric" value="1" min="1"></div><div><label>Precio c/u</label><input id="vpr" type="number" inputmode="numeric" placeholder="0"></div></div>'+
 '<button onclick="addV()">Guardar venta</button></div>'+segHtml()+
 '<div class="card">'+(list.length?list.map(function(x){return '<div class="item"><div><b>'+esc(x.p)+'</b><span class="mu">'+fdate(x.f)+' · '+x.c+' × '+money(x.u)+'</span></div><div class="row" style="flex:0"><b class="ok">'+money(x.t)+'</b><button class="x" onclick="delV('+x.id+')">✕</button></div></div>'}).join(""):'<div class="empty">Sin ventas en este período</div>')+'</div>'
}
function vSel(){var id=$("vp").value,it=S.i.filter(function(x){return x.id==id})[0];$("vn").style.display=it?"none":"block";if(it&&it.pr)$("vpr").value=it.pr}
function addV(){
 var id=$("vp").value,it=S.i.filter(function(x){return x.id==id})[0],c=+$("vc").value,u=+$("vpr").value,n=it?it.n:$("vnom").value.trim();
 if(!n||c<=0||u<=0){alert("Completa nombre, cantidad y precio");return}
 if(it)it.c=Math.max(0,it.c-c);
 S.v.push({id:uid(),f:hoy(),p:n,c:c,u:u,t:c*u,iid:it?it.id:null});save();render()
}
function delV(id){if(!confirm("¿Borrar esta venta?"))return;var x=S.v.filter(function(y){return y.id==id})[0],it=x&&S.i.filter(function(y){return y.id==x.iid})[0];if(it)it.c+=x.c;S.v=S.v.filter(function(y){return y.id!=id});save();render()}

function vGastos(){
 var list=S.g.filter(function(x){return inPer(x.f)}).slice().reverse();
 return '<div class="card"><b>Anotar gasto</b><label>¿En qué?</label><input id="gc" placeholder="Ej: Cacao, cajas, bencina">'+
 '<label>Monto</label><input id="gm" type="number" inputmode="numeric" placeholder="0"><button onclick="addG()">Guardar gasto</button></div>'+segHtml()+
 '<div class="card">'+(list.length?list.map(function(x){return '<div class="item"><div><b>'+esc(x.c)+'</b><span class="mu">'+fdate(x.f)+'</span></div><div class="row" style="flex:0"><b class="bad">'+money(x.m)+'</b><button class="x" onclick="delG('+x.id+')">✕</button></div></div>'}).join(""):'<div class="empty">Sin gastos en este período</div>')+'</div>'
}
function addG(){var c=$("gc").value.trim(),m=+$("gm").value;if(!c||m<=0){alert("Completa concepto y monto");return}S.g.push({id:uid(),f:hoy(),c:c,m:m});save();render()}
function delG(id){if(!confirm("¿Borrar este gasto?"))return;S.g=S.g.filter(function(y){return y.id!=id});save();render()}

function vInv(){
 function blk(t,title){var l=S.i.filter(function(x){return x.t==t});
  return '<h2>'+title+'</h2><div class="card">'+(l.length?l.map(function(x){return '<div class="item"><div><b>'+esc(x.n)+(x.c<=2?'<span class="low">poco</span>':"")+'</b>'+(x.pr?'<span class="mu">'+money(x.pr)+' c/u</span>':"")+'</div><div class="row" style="flex:0"><button class="sm" onclick="adj('+x.id+',-1)">−</button><b style="min-width:30px;text-align:center">'+x.c+'</b><button class="sm" onclick="adj('+x.id+',1)">+</button><button class="x" onclick="delI('+x.id+')">✕</button></div></div>'}).join(""):'<div class="empty">Vacío</div>')+'</div>'}
 return '<div class="card"><b>Agregar al inventario</b><label>Tipo</label><select id="it"><option value="p">Producto para vender</option><option value="i">Insumo (cacao, cajas…)</option></select>'+
 '<label>Nombre</label><input id="in" placeholder="Ej: Trufas"><div class="row"><div><label>Cantidad</label><input id="ic" type="number" inputmode="numeric" value="0"></div><div><label>Precio venta</label><input id="ip" type="number" inputmode="numeric" placeholder="Opcional"></div></div>'+
 '<button onclick="addI()">Agregar</button></div>'+blk("p","Productos")+blk("i","Insumos")
}
function addI(){var n=$("in").value.trim();if(!n){alert("Escribe un nombre");return}S.i.push({id:uid(),n:n,t:$("it").value,c:+$("ic").value||0,pr:+$("ip").value||0});save();render()}
function adj(id,d){var x=S.i.filter(function(y){return y.id==id})[0];if(x){x.c=Math.max(0,x.c+d);save();render()}}
function delI(id){if(!confirm("¿Quitar del inventario?"))return;S.i=S.i.filter(function(y){return y.id!=id});save();render()}

function render(){nav();$("app").innerHTML={inicio:vInicio,ventas:vVentas,gastos:vGastos,inv:vInv}[tab]();window.scrollTo(0,0)}
render();
</script>
<script>
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
</body>
</html>
